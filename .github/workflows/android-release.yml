name: Android Release APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"

          KEYSTORE_PATH="$RUNNER_TEMP/upload-key.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape_property(value: str) -> str:
              escaped = []
              for index, char in enumerate(value):
                  if char == "\\":
                      escaped.append("\\\\")
                  elif char == "\n":
                      escaped.append("\\n")
                  elif char == "\r":
                      escaped.append("\\r")
                  elif char == "\t":
                      escaped.append("\\t")
                  elif char in "=:#!":
                      escaped.append("\\" + char)
                  elif char == " " and index == 0:
                      escaped.append("\\ ")
                  elif ord(char) < 0x20 or ord(char) > 0x7E:
                      escaped.append(f"\\u{ord(char):04x}")
                  else:
                      escaped.append(char)
              return "".join(escaped)

          properties = {
              "storePassword": os.environ["ANDROID_STORE_PASSWORD"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "storeFile": os.path.join(os.environ["RUNNER_TEMP"], "upload-key.p12"),
          }
          content = "\n".join(
              f"{key}={escape_property(value)}" for key, value in properties.items()
          ) + "\n"
          Path("android/key.properties").write_text(content, encoding="ascii")
          PY

      - name: Build signed release APK
        run: flutter build apk --release --no-pub

      - name: Show APK size and checksum
        run: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tic-tac-toe-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/upload-key.p12"
